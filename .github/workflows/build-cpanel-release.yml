name: Build ASB LiftDoc cPanel Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asb-liftdoc-cpanel-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare CI-only runtime placeholders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          printf '{"version":1,"users":[]}\n' > data/auth-users.json
          printf 'ASB_AUTH_SECRET=%s\n' 'ci-build-only-not-production-0123456789abcdef0123456789abcdef0123456789abcdef' > .env.local

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Linux production build
        run: npx next build --webpack

      - name: Verify CI auth secret was not baked into output
        shell: bash
        run: |
          set -euo pipefail
          MARKER='ci-build-only-not-production-0123456789abcdef0123456789abcdef0123456789abcdef'
          if grep -R -F -l --binary-files=without-match "$MARKER" .next | head -n 1 | grep -q .; then
            echo "CI-only auth secret appeared in build output. Refusing to publish."
            exit 1
          fi

      - name: Package prebuilt release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .next/cache .next/dev
          rm -f .env.local
          rm -f data/auth-users.json

          OUT=/tmp/asb-liftdoc-release
          rm -rf "$OUT"
          mkdir -p "$OUT"

          ITEMS=(
            .next
            public
            src
            package.json
            package-lock.json
            server.js
            next.config.ts
            tsconfig.json
          )

          for item in "${ITEMS[@]}"; do
            if [ ! -e "$item" ]; then
              echo "Required release item missing: $item"
              exit 1
            fi
          done

          tar -czf "$OUT/release.tar.gz" "${ITEMS[@]}"

          (
            cd "$OUT"
            sha256sum release.tar.gz > release.sha256
          )

          printf '%s\n' "$GITHUB_SHA" > "$OUT/release.commit"

          SIZE=$(stat -c%s "$OUT/release.tar.gz")
          MAX=$((90 * 1024 * 1024))

          echo "Release size: $SIZE bytes"

          if [ "$SIZE" -gt "$MAX" ]; then
            echo "Release artifact exceeds 90 MB. Refusing to publish to Git branch."
            exit 1
          fi

      - name: Publish release branch
        shell: bash
        run: |
          set -euo pipefail

          OUT=/tmp/asb-liftdoc-release

          git config user.name "ASB LiftDoc Release Bot"
          git config user.email "actions@users.noreply.github.com"

          git checkout --orphan asb-deploy
          git rm -rf . >/dev/null 2>&1 || true

          cp "$OUT/release.tar.gz" .
          cp "$OUT/release.sha256" .
          cp "$OUT/release.commit" .

          cat > README.txt <<TXT
          ASB LiftDoc prebuilt cPanel release.
          Source commit: $GITHUB_SHA
          Generated by GitHub Actions. Do not edit manually.
          TXT

          git add release.tar.gz release.sha256 release.commit README.txt
          git commit -m "Prebuilt release $GITHUB_SHA"
          git push --force origin HEAD:asb-deploy
