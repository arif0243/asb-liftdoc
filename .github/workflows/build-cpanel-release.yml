name: Build ASB LiftDoc cPanel Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asb-liftdoc-cpanel-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare CI-only runtime placeholders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          printf '{"version":1,"users":[]}\n' > data/auth-users.json
          printf 'ASB_AUTH_SECRET=%s\n' 'ci-build-only-not-production-0123456789abcdef0123456789abcdef0123456789abcdef' > .env.local

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Linux standalone production build
        run: npx next build --webpack

      - name: Verify standalone output
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          test -f .next/standalone/package.json
          test -d .next/static

      - name: Verify CI auth secret was not baked into output
        shell: bash
        run: |
          set -euo pipefail
          MARKER='ci-build-only-not-production-0123456789abcdef0123456789abcdef0123456789abcdef'
          if grep -R -F -l --binary-files=without-match "$MARKER" .next/standalone .next/static | head -n 1 | grep -q .; then
            echo "CI-only auth secret appeared in build output. Refusing to publish."
            exit 1
          fi

      - name: Assemble cPanel runtime
        shell: bash
        run: |
          set -euo pipefail

          rm -f .env.local
          rm -f data/auth-users.json

          OUT="$RUNNER_TEMP/asb-liftdoc-cpanel"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          cp -a .next/standalone/. "$OUT/"
          mkdir -p "$OUT/.next"
          cp -a .next/static "$OUT/.next/static"

          if [ -d public ]; then
            cp -a public "$OUT/public"
          fi

          cat > "$OUT/CPANEL-DEPLOYMENT.txt" <<'TXT'
ASB LiftDoc cPanel Runtime Package

Node.js:
- Use Node.js 22.

Application root:
- The folder where this ZIP is extracted.

Startup file:
- server.js

Required environment variable:
- ASB_AUTH_SECRET = a private random secret of at least 32 characters.

Persistent runtime data:
- data/ must remain writable and must be preserved between deployments.
- This application currently uses JSON files in data/ instead of DATABASE_URL.

Do not:
- run next build on cPanel
- upload .env.local inside a public repository
- overwrite the live data/ folder during updates

The generated server.js reads PORT/HOSTNAME from the hosting environment.
TXT

          printf '%s\n' "$GITHUB_SHA" > "$OUT/RELEASE-COMMIT.txt"

          (
            cd "$OUT"
            zip -qr "$RUNNER_TEMP/ASB-LiftDoc-cPanel.zip" .
          )

          sha256sum "$RUNNER_TEMP/ASB-LiftDoc-cPanel.zip" > "$RUNNER_TEMP/ASB-LiftDoc-cPanel.zip.sha256"

          echo "Package size:"
          du -h "$RUNNER_TEMP/ASB-LiftDoc-cPanel.zip"

      - name: Upload cPanel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ASB-LiftDoc-cPanel
          path: |
            ${{ runner.temp }}/ASB-LiftDoc-cPanel.zip
            ${{ runner.temp }}/ASB-LiftDoc-cPanel.zip.sha256
          if-no-files-found: error
          retention-days: 14
